<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="silverInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="url(#goldRim)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.6))" />
  <circle cx="100" cy="100" r="88" fill="#1e293b" stroke="#ca8a04" stroke-width="2" />
  
  <!-- Metallic Inner Face -->
  <circle cx="100" cy="100" r="82" fill="url(#silverInner)" />
  
  <!-- Notches / Ridges -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7" />

  <!-- Center Token Icon: Stylized Diamond / T -->
  <path d="M100 45 L138 75 L138 125 L100 155 L62 125 L62 75 Z" fill="none" stroke="url(#accentCyan)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M80 82 L120 82 M100 82 L100 128" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />
  
  <!-- Subtle Highlight Curve -->
  <path d="M45 85 A70 70 0 0 1 155 85" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round" />
</svg>
